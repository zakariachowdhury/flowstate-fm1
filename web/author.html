<!-- Flowstate World Author (Phase 15): the page of tools/world_author.py (./tools/world-author). One file, no

     ?ref=user/x.world.json opens a file, ?tab=macros a tab, ?pos=0.8 the macro preview's position, ?dev=1 the

<style>

<body>
<header class="top">
  <div class="bar">
    <span class="brand">FLOWSTATE · WORLD AUTHOR</span>
    <span id="file">—</span><span id="dirty"></span><span id="ro" class="chip" hidden>READ-ONLY</span>
    <span style="flex:1"></span>
    <button class="ghost" id="b-new" title="a new World from the template">New</button>
    <button class="ghost" id="b-open">Open</button>
    <button class="ghost" id="b-import" title="a user World blob (.wblob) as a source: worldc import">Import</button>
    <button id="b-save" title="Cmd/Ctrl+S">Save</button>
    <button class="ghost" id="b-saveas">Save As</button>
    <button class="ghost" id="b-export">Export</button>
    <button class="ghost" id="b-preview" title="play it in the simulator (it reloads on every save)">Preview</button>
    <span id="sim" class="chip">SIM</span>
    <input type="file" id="f-import" accept=".wblob,application/octet-stream" hidden>
  </div>
  <div id="status"></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="layout">
  <main id="view"></main>
  <aside id="problems"></aside>
</div>
<footer>Every edit is checked by tools/worldc.py as you type. The simulator plays the saved file and reloads it on
  every save. <span id="devhint">Alt+D: diagnostics (developer).</span></footer>
<section id="drawer" hidden></section>
<dialog id="dlg"></dialog>
<datalist id="dl-targets"></datalist><datalist id="dl-ptargets"></datalist><datalist id="dl-gtargets"></datalist>
<script>
"use strict";
/*HELPERS-BEGIN*/
/* Pure helpers (no DOM, no network): web/../tests/author_test.py runs them in node's vm. Each mirrors
   tools/worldc.py where it parses the notation (scan_steps, step_token, ROMAN, curves). */
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const PCS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteName(n) { return NOTE[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1); }
function parseNote(s) {
  const m = /^([A-G])([#b]?)(-1|[0-9])$/.exec(String(s));
  if (!m) return null;
  const n = 12 * (Number(m[3]) + 1) + PCS[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  return n >= 0 && n <= 127 ? n : null;
}
function jp(path, key) {
  if (typeof key === "number") return `${path}[${key}]`;
  return /^[A-Za-z_][A-Za-z0-9_]*$/.test(key) ? `${path}.${key}` : `${path}[${JSON.stringify(key)}]`;
}
/* drum lanes: one character a step, '|' between bars of 16 */
const DRUM_CYCLE = [".", "x", "X", "s", "g", "2", "3", "4"];
function drumCells(s) { return String(s || "").replace(/\|/g, "").split(""); }
function drumString(cells, bars) {
  const s = cells.join("");
  return bars && s.length > 16 ? s.match(/.{1,16}/g).join("|") : s;
}
function drumCycle(c, dir) {
  const i = Math.max(0, DRUM_CYCLE.indexOf(c));
  return DRUM_CYCLE[(i + (dir < 0 ? -1 : 1) + DRUM_CYCLE.length) % DRUM_CYCLE.length];
}
function drumLength(lanes) { const v = Object.values(lanes || {}); return v.length ? drumCells(v[0]).length : 16; }
function drumResize(lanes, n) {
  const out = {};
  for (const [k, v] of Object.entries(lanes || {})) {
    const c = drumCells(v).slice(0, n);
    while (c.length < n) c.push(".");
    out[k] = drumString(c, n > 16);
  }
  return out;
}
/* melodic steps (worldc.py scan_steps, step_token) */
function scanSteps(s) {
  const out = []; let i = 0; const n = s.length;
  while (i < n) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === "|") { out.push("|"); i++; continue; }
    let j = i, depth = 0, broke = false;
    while (j < n && (depth || !(/\s/.test(s[j]) || s[j] === "|"))) {
      if (s[j] === "[") depth++;
      else if (s[j] === "]") { depth--; if (depth < 0) { broke = true; break; } }
      j++;
    }
    if (depth === 0 || broke) { out.push(s.slice(i, j)); i = j; if (broke) { out.push(s.slice(j)); break; } }
    else { out.push(s.slice(i)); i = n; }
  }
  return out;
}
const TOKEN_ITEM = /^(?:([b#]*)([1-9][0-9]*)(['’,]*)|c([13579])(['’,]*)|([A-G][#b]?(?:-1|[0-9])))$/;
function octOf(s) { return (s.match(/['’]/g) || []).length - (s.match(/,/g) || []).length; }
function parseStep(tk) {
  if (tk === ".") return { ok: true, kind: "rest", text: tk };
  if (tk === "-") return { ok: true, kind: "tie", text: tk };
  const m = /^(\[[^\]]*\]|[^[\]!_~*]+)((?:!|_|~|\*[2-4])*)$/.exec(tk);
  if (!m) return { ok: false, text: tk, error: `${JSON.stringify(tk)} is not a step` };
  const sfx = m[2].match(/!|_|~|\*[2-4]/g) || [];
  if (new Set(sfx.map((x) => x[0])).size !== sfx.length) return { ok: false, text: tk, error: `${JSON.stringify(tk)}: a suffix twice` };
  const body = m[1];
  const items = body.startsWith("[") ? body.slice(1, -1).trim().split(/\s+/).filter(Boolean) : [body];
  if (items.length < 1 || items.length > 4) return { ok: false, text: tk, error: `${JSON.stringify(tk)}: 1..4 notes in a step` };
  const out = [];
  for (const it of items) {
    const mm = TOKEN_ITEM.exec(it);
    if (!mm) return { ok: false, text: tk, error: `${JSON.stringify(it)} is not a degree (1..7, b3, 5'), a chord tone (c1 c3 c5 c7 c9) or a note (A#3)` };
    if (mm[2]) out.push({ kind: "deg", deg: Number(mm[2]), acc: (mm[1].match(/#/g) || []).length - (mm[1].match(/b/g) || []).length, oct: octOf(mm[3]) });
    else if (mm[4]) out.push({ kind: "chord", n: Number(mm[4]), oct: octOf(mm[5]) });
    else {
      const note = parseNote(mm[6]);
      if (note === null) return { ok: false, text: tk, error: `${JSON.stringify(it)} is outside MIDI 0..127` };
      out.push({ kind: "note", note });
    }
  }
  const rat = sfx.find((x) => x[0] === "*");
  return { ok: true, kind: "notes", text: tk, items: out, accent: sfx.includes("!"), soft: sfx.includes("_"),
           slide: sfx.includes("~"), ratchet: rat ? Number(rat[1]) : 1 };
}
function parseSteps(text, perBar) {
  const toks = scanSteps(String(text || "")); const steps = []; const bars = []; let bar = 0;
  for (const t of toks) {
    if (t === "|") { bars.push(bar); bar = 0; continue; }
    steps.push(parseStep(t)); bar++;
  }
  let error = null;
  if (bars.length) { bars.push(bar); if (perBar && bars.some((b) => b !== perBar)) error = `bars of [${bars.join(", ")}] steps; a bar is ${perBar}`; }
  if (!error && (steps.length < 1 || steps.length > 64)) error = `${steps.length} steps: a pattern is 1..64 steps`;
  const bad = steps.findIndex((s) => !s.ok);
  if (!error && bad >= 0) error = `step ${bad + 1}: ${steps[bad].error}`;
  return { steps, bars: bars.length ? bars : null, error };
}
function joinSteps(tokens, perBar) {
  if (perBar && tokens.length > perBar && tokens.length % perBar === 0) {
    const out = [];
    for (let i = 0; i < tokens.length; i += perBar) out.push(tokens.slice(i, i + perBar).join(" "));
    return out.join(" | ");
  }
  return tokens.join(" ");
}
function withSuffix(tk, sfx, on) {   /* a step's token with suffix ! _ ~ *n set or cleared (rests and ties have none) */
  const p = parseStep(tk);
  if (!p.ok || p.kind !== "notes") return tk;
  const m = /^(\[[^\]]*\]|[^[\]!_~*]+)((?:!|_|~|\*[2-4])*)$/.exec(tk);
  let s = (m[2].match(/!|_|~|\*[2-4]/g) || []).filter((x) => x[0] !== sfx[0]);
  if (on) s.push(sfx);
  return m[1] + s.join("");
}
/* progressions (worldc.py Compiler.ROMAN, SUF_ANY, SUF_CASE) */
const ROMAN = /^([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(.*?)(?::(\d+))?$/;
const SUF_ANY = { "°": "DIM", o: "DIM", dim: "DIM", "+": "AUG", aug: "AUG", sus2: "SUS2", sus4: "SUS4", sus: "SUS4", 5: "POW5",
  "ø": "M7B5", "ø7": "M7B5", m7b5: "M7B5", "°7": "DIM7", o7: "DIM7", dim7: "DIM7" };
const SUF_CASE = { "": ["MAJ", "MIN"], 7: ["DOM7", "MIN7"], 6: ["MAJ6", "MIN6"], add9: ["ADD9", "MADD9"], 9: ["ADD9", "MADD9"],
  maj7: ["MAJ7", null], M7: ["MAJ7", null], "Δ": ["MAJ7", null], "Δ7": ["MAJ7", null] };
const NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII"];
function parseChord(c) {
  const m = typeof c === "string" ? ROMAN.exec(c) : null;
  if (!m) return { ok: false, error: `${JSON.stringify(c)}: a roman numeral such as i, VI, bVII7, ii°:2` };
  const [, acc, num, suf, beats] = m;
  const upper = num === num.toUpperCase();
  let q = null;
  if (suf in SUF_ANY) q = SUF_ANY[suf];
  else if (suf in SUF_CASE) q = SUF_CASE[suf][upper ? 0 : 1];
  if (!q) return { ok: false, error: `${JSON.stringify(c)}: unknown chord suffix ${JSON.stringify(suf)}` };
  const b = beats ? Number(beats) : 4;
  if (b < 1 || b > 32) return { ok: false, error: `${JSON.stringify(c)}: 1..32 beats` };
  return { ok: true, acc, numeral: num, degree: NUMERALS.indexOf(num.toUpperCase()), upper, suffix: suf, quality: q, beats: b };
}
function chordWithBeats(c, beats) { const m = ROMAN.exec(c); return m ? `${m[1]}${m[2]}${m[3]}${beats === 4 && !m[4] ? "" : ":" + beats}` : c; }
function progBeats(list) { let t = 0; for (const c of list || []) { const p = parseChord(c); if (!p.ok) return NaN; t += p.beats; } return t; }
/* curves (worldc.py Compiler.lut, macro.c): y(u) for u = 0..1 how far the knob is from home */
const BUILTIN_CURVES = ["lin", "exp", "log", "s", "late"];
function curveLut(c) {
  if (Array.isArray(c) && c.length === 9) return c.map(Number);
  if (c && Array.isArray(c.lut) && c.lut.length === 9) return c.lut.map((x) => x / 255);
  if (c && Array.isArray(c.points) && c.points.length >= 2) {
    const p = c.points, out = [];
    for (let k = 0; k < 9; k++) {

async function doNew() {

async function doSave(force) {
  if (!S.W) return;
  if (!S.ref || !S.writable) return doSaveAs();
  try {
    const r = await api("save", { ref: S.ref, world: P(), new: S.isNew, base_mtime: S.isNew ? null : S.mtime, force: !!force });
    S.dirty = false; S.isNew = false; S.mtime = r.mtime; S.check = r.check; S.sim = r.sim;

async function doSaveAs() {

function download(name, data, type) { const a = h("a", { href: URL.createObjectURL(new Blob([data], { type })), download: name }); document.body.append(a); a.click(); a.remove(); }
async function doExport() {
  const ks = { wblob: h("input", { type: "checkbox", checked: true }), c: h("input", { type: "checkbox", checked: true }), json: h("input", { type: "checkbox", checked: true }) };

async function doPreview() {
  try {
    if (!S.ref || S.isNew || S.dirty) {
      if (!confirm("The simulator plays the saved file. Save now?")) return;
      await doSave();
      if (S.dirty || S.isNew) return;
    }
    const r = await api("preview", { ref: S.ref });
    S.sim = r; head();
    if (r.missing) say(`no simulator: ${r.build}`, "bad");
    else say(r.reused ? "the simulator is playing this file: it reloads on every save" : `simulator started (pid ${r.pid}): Option+Space plays, it reloads on every save`, "ok");
    pollSim();
  } catch (e) { say(e.message, "bad"); }
}
async function pollSim() { try { S.sim = await api("preview"); head(); if (S.sim.running) schedule("sim", 3000, pollSim); } catch { /* the server went away */ } }
async function doImport(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let s = ""; for (const b of buf) s += String.fromCharCode(b);
  try {
    const r = await api("import", { blob: btoa(s) });
    if (!confirmDiscard()) return;
    S.W = r.world; S.ref = `user/${r.world.id}.world.json`; S.writable = true; S.isNew = true; S.dirty = true; S.mtime = null;
    S.check = S.harmony = S.job = null; render(); runCheck(); runHarmony(); say(`imported ${file.name}: Save writes ${S.ref}`);
  } catch (e) { say(e.message, "bad"); }
}

window.addEventListener("error", (ev) => { S.errors.push(String(ev.message)); say("page error: " + ev.message, "bad"); });
window.addEventListener("unhandledrejection", (ev) => { S.errors.push(String(ev.reason && ev.reason.message || ev.reason)); });

async function selftestWrite(errs) {   /* ?selftest=write (a scratch worlds directory only): the file paths of the page */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const id = "selftest_" + Date.now().toString(36);
  window.confirm = () => true;
  try {
    const r = await api(`new?id=${id}&name=SELFTEST`);
    S.W = r.world; S.ref = `user/${id}.world.json`; S.writable = true; S.isNew = true; S.dirty = true; render();
    await doSave();
    if (S.dirty || S.isNew) errs.push("write: New + Save");

    await openRef(S.ref);
    if (S.W.blurb !== "edited by the page" || S.dirty) errs.push("write: edit, Save, reload");

}
async function selftest() {   /* ?selftest=1: every tab rendered once, the drawer, the macro test: errors into the title */
  const errs = [];
  await new Promise((r) => setTimeout(r, 400));
  for (const [k] of TABS) { try { S.tab = k; render(); await new Promise((r) => setTimeout(r, 120)); } catch (e) { errs.push(`${k}: ${e.message}`); } }
  try { S.tab = "macros"; render(); await testAllMacros(); toggleDrawer(true); await runDiag(); await new Promise((r) => setTimeout(r, 300)); } catch (e) { errs.push(`macros: ${e.message}`); }
